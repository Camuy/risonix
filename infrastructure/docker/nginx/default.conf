# Risonix — reverse proxy del profilo `prod`.
# Ingresso unico su :80 → frontend statico (Nginx) e API FastAPI.

upstream risonix_frontend {
    server mri-frontend-prod:3000;
}

upstream risonix_api {
    server mri-api:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API
    location /api/ {
        proxy_pass http://risonix_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://risonix_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
